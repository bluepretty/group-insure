spring:
  application:
    name: group-insure
  profiles:
    active: local

server:
  port: 8080

jwt:
  # Shared secret used for signing JWTs. Override via env in production.
  secret: ${JWT_SECRET:change-me-in-production-group-insure-secret}
  # Token validity in milliseconds (e.g. 8 hours).
  expiry-ms: ${JWT_EXPIRY_MS:28800000}

logging:
  level:
    com.insure: DEBUG
