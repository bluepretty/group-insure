<div class="row g-4">
  <div class="col-md-6 col-xl-3">
    <div class="stat-card card blue">
      <div class="ic"><i class="bi bi-building"></i></div>
      <div class="k">Policyholders</div>
      <div class="v">{{ report.policyholders }}</div>
      <div class="d">active accounts</div>
    </div>
  </div>
  <div class="col-md-6 col-xl-3">
    <div class="stat-card card green">
      <div class="ic"><i class="bi bi-shield-check"></i></div>
      <div class="k">Active Policies</div>
      <div class="v">{{ report.active_policies }}</div>
      <div class="d">in force now</div>
    </div>
  </div>
  <div class="col-md-6 col-xl-3">
    <div class="stat-card card teal">
      <div class="ic"><i class="bi bi-people"></i></div>
      <div class="k">Enrolled Members</div>
      <div class="v">{{ report.members }}</div>
      <div class="d">on all policies</div>
    </div>
  </div>
  <div class="col-md-6 col-xl-3">
    <div class="stat-card card amber">
      <div class="ic"><i class="bi bi-clipboard-check"></i></div>
      <div class="k">Open Claims</div>
      <div class="v">{{ report.claims_open }}</div>
      <div class="d">awaiting review</div>
    </div>
  </div>
</div>
