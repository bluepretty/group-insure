{% extends "base.html" %}

{% block title %}Login — Group Insurance{% endblock %}

{% block body %}
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4">
            <i class="bi bi-shield-lock text-primary"></i> Group Insurance
          </h3>

          {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
          {% endif %}

          <form action="/api/auth/login" method="post" hx-post="/api/auth/login"
                hx-target="#errors" hx-swap="innerHTML"
                hx-on::after-request="if (requestEvent.xhr.status === 200) window.location.href='/dashboard';">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" name="username" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
          </form>

          <div id="errors" class="mt-3"></div>
          <div class="text-center mt-3">
            <a href="/register">Create an account</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
