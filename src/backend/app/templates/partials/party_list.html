<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Policyholders &amp; Brokers</h2>
</div>

<div class="card shadow-sm mb-4">
  <div class="card-body">
    <form hx-post="/api/parties/create" hx-target="#content" hx-swap="innerHTML">
      <div class="row g-2 align-items-end">
        <div class="col-sm-4">
          <label class="form-label mb-1 small">Name</label>
          <input type="text" class="form-control" name="name" required>
        </div>
        <div class="col-sm-3">
          <label class="form-label mb-1 small">Type</label>
          <select class="form-select" name="party_type" required>
            <option value="policyholder">Policyholder</option>
            <option value="broker">Broker</option>
          </select>
        </div>
        <div class="col-sm-3">
          <label class="form-label mb-1 small">Email</label>
          <input type="email" class="form-control" name="email" placeholder="optional">
        </div>
        <div class="col-sm-2">
          <button type="submit" class="btn btn-primary w-100">Add</button>
        </div>
      </div>
    </form>
  </div>
</div>

<ul class="list-group">
  {% for party in parties %}
  <li class="list-group-item d-flex justify-content-between align-items-center">
    <div>
      <span>{{ party.name }}</span>
      <span class="badge bg-primary rounded-pill ms-2">{{ party.party_type }}</span>
      {% if not party.active %}
      <span class="badge bg-secondary rounded-pill">inactive</span>
      {% endif %}
    </div>
    <span>
      {% if manage_parties %}
      <button
        type="button"
        class="btn btn-sm btn-outline-primary"
        hx-get="/api/parties/{{ party.id }}"
        hx-target="#edit-modal-body"
        hx-swap="innerHTML"
        hx-on::after-request="populateEditModal(this, {{ party.id }}, '{{ party.name }}', '{{ party.party_type }}', '{{ party.email or '' }}', {{ 'true' if party.active else 'false' }})"
        data-bs-toggle="modal"
        data-bs-target="#edit-party-modal">
        <i class="bi bi-pencil"></i> Edit
      </button>
      <button
        type="button"
        class="btn btn-sm btn-outline-danger"
        hx-delete="/api/parties/{{ party.id }}"
        hx-target="#content"
        hx-swap="innerHTML"
        hx-on::after-request="refreshOnPartyDelete(this)">
        <i class="bi bi-trash"></i> Delete
      </button>
      {% endif %}
    </span>
  </li>
  {% else %}
  <li class="list-group-item text-muted">No parties yet.</li>
  {% endfor %}
</ul>

<!-- Edit modal -->
<div class="modal fade" id="edit-party-modal" tabindex="-1" aria-labelledby="edit-party-modal-label" aria-hidden="true">
  <div class="modal-dialog">
    <form id="edit-party-form" hx-put hx-target="#content" hx-swap="innerHTML" hx-on::after-request="onPartyEditDone(this)" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="edit-party-modal-label">Edit party</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="edit-modal-body">
        <input type="hidden" name="party_id" id="edit-party-id" value="">
        <div class="mb-3">
          <label class="form-label mb-1 small">Name</label>
          <input type="text" class="form-control" name="name" id="edit-party-name" required>
        </div>
        <div class="mb-3">
          <label class="form-label mb-1 small">Type</label>
          <select class="form-select" name="party_type" id="edit-party-type">
            <option value="policyholder">Policyholder</option>
            <option value="broker">Broker</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label mb-1 small">Email</label>
          <input type="email" class="form-control" name="email" id="edit-party-email" placeholder="optional">
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="active" id="edit-party-active" value="true">
          <label class="form-check-label" for="edit-party-active">Active</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Populate the modal inputs when the Edit button's after-request returns the
  // party (the hx-get call above). party_type is a fixed enum; active is a JS
  // boolean.
  function populateEditModal(el, id, name, party_type, email, active) {
    var modalEl = document.getElementById('edit-party-modal');
    var form = document.getElementById('edit-party-form');
    form.dataset.partyId = id;
    document.getElementById('edit-party-id').value = id;
    document.getElementById('edit-party-name').value = name;
    var typeSel = document.getElementById('edit-party-type');
    typeSel.value = (party_type === 'policyholder' || party_type === 'broker') ? party_type : 'policyholder';
    document.getElementById('edit-party-email').value = email || '';
    document.getElementById('edit-party-active').checked = !!active;
    bootstrap.Modal.getOrCreateInstance(modalEl).show();
  }

  // After the edit form is saved (PUT) or failed, close the modal and reload
  // the list so the table reflects the latest state.
  function onPartyEditDone(el) {
    var modalEl = document.getElementById('edit-party-modal');
    bootstrap.Modal.getInstance(modalEl)?.hide();
    fetch('/api/parties/list', { headers: { 'HX-Request': 'true' } })
      .then(function (r) { return r.text(); })
      .then(function (html) { document.getElementById('content').innerHTML = html; });
  }

  // After a delete (success or 409), reload the list.
  function refreshOnPartyDelete(el) {
    fetch('/api/parties/list', { headers: { 'HX-Request': 'true' } })
      .then(function (r) { return r.text(); })
      .then(function (html) { document.getElementById('content').innerHTML = html; });
  }
</script>
